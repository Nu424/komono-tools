<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>XAFS測定条件メーカー</title>
  <meta name="description" content="NT用XAFS の測定条件を視覚的に組み立てるツール" />

  <style>
    /* =========================================================
       デザイントークン
       ========================================================= */
    :root {
      --slate-950: #020617;
      --slate-900: #0f172a;
      --slate-800: #1e293b;
      --slate-500: #64748b;
      --slate-400: #94a3b8;
      --slate-300: #cbd5e1;
      --slate-100: #f1f5f9;
      --cyan-400: #22d3ee;
      --cyan-300: #67e8f9;
      --cyan-200: #a5f3fc;
      --cyan-100: #cffafe;
      --cyan-50: #ecfeff;
      --emerald-400: #34d399;
      --emerald-100: #d1fae5;
      --emerald-50: #ecfdf5;

      --line: rgba(255, 255, 255, .1);
      --line-soft: rgba(255, 255, 255, .05);
      --shadow-lg: 0 25px 50px -12px rgba(0, 0, 0, .3);

      --radius-lg: .5rem;
      --radius-xl: .75rem;
      --radius-2xl: 1rem;
      --radius-3xl: 1.5rem;

      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }

    /* =========================================================
       ベース
       ========================================================= */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(34, 211, 238, .18), transparent 32%),
        linear-gradient(180deg, var(--slate-950) 0%, var(--slate-950) 100%);
      background-color: var(--slate-950);
      color: var(--slate-100);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Hiragino Sans",
        "Noto Sans JP", "Yu Gothic UI", sans-serif;
      font-size: 16px;
      line-height: 1.5;
      -webkit-text-size-adjust: 100%;
    }

    h1,
    h2,
    h3,
    p {
      margin: 0;
    }

    .page {
      max-width: 80rem;
      margin-inline: auto;
      padding: .75rem;
    }

    @media (min-width: 640px) {
      .page {
        padding-inline: 1rem;
      }
    }

    /* =========================================================
       カード
       ========================================================= */
    .card {
      min-width: 0;
      padding: 1rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-3xl);
      background: rgba(15, 23, 42, .75);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(8px);
    }

    .card--header {
      margin-bottom: .75rem;
      background: rgba(15, 23, 42, .8);
    }

    .eyebrow {
      font-size: .75rem;
      line-height: 1rem;
      letter-spacing: .4em;
      text-transform: uppercase;
      color: rgba(103, 232, 249, .7);
    }

    .page-title {
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 700;
      color: #fff;
    }

    .page-subtitle {
      margin-top: .25rem;
      font-size: .875rem;
      line-height: 1.25rem;
      color: var(--slate-400);
    }

    .header-body {
      display: flex;
      flex-direction: column;
      gap: .5rem;
      margin-top: .5rem;
    }

    @media (min-width: 768px) {
      .header-body {
        flex-direction: row;
        align-items: flex-end;
        justify-content: space-between;
      }
    }

    /* 選択中の吸収端の表示 */
    .edge-readout {
      width: 100%;
      padding: .75rem 1rem;
      border: 1px solid rgba(34, 211, 238, .2);
      border-radius: var(--radius-2xl);
      background: rgba(34, 211, 238, .1);
      font-size: .875rem;
      color: var(--cyan-100);
    }

    @media (min-width: 768px) {
      .edge-readout {
        width: auto;
      }
    }

    .edge-readout strong {
      font-weight: 600;
    }

    .edge-readout-energy {
      font-family: var(--mono);
      font-size: 1rem;
      line-height: 1.5rem;
    }

    /* =========================================================
       セクション見出し
       ========================================================= */
    .section-title {
      margin-bottom: .75rem;
    }

    .section-title .eyebrow {
      font-size: 11px;
      letter-spacing: .28em;
    }

    .section-title h2 {
      margin-top: .25rem;
      font-size: 1.125rem;
      line-height: 1.75rem;
      font-weight: 600;
      color: #fff;
    }

    .section-title p {
      margin-top: .25rem;
      font-size: .875rem;
      line-height: 1.25rem;
      color: var(--slate-400);
    }

    /* =========================================================
       レイアウト
       ========================================================= */
    .layout {
      display: grid;
      gap: .75rem;
      min-width: 0;
    }

    @media (min-width: 1024px) {
      .layout {
        grid-template-columns: 1.45fr 0.50fr;
      }
    }

    /* =========================================================
       グラフィカル入力（SVG）
       ========================================================= */
    .svg-frame {
      min-width: 0;
      padding: .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-2xl);
      background: rgba(2, 6, 23, .6);
    }

    .svg-scroller {
      width: 100%;
      max-width: 100%;
      overflow-x: auto;
    }

    .svg-scroller svg {
      width: 100%;
      height: auto;
      min-width: 560px;
      border-radius: var(--radius-2xl);
    }

    @media (min-width: 640px) {
      .svg-scroller svg {
        min-width: 620px;
      }
    }

    @media (min-width: 768px) {
      .svg-scroller svg {
        min-width: 700px;
      }
    }

    @media (min-width: 1024px) {
      .svg-scroller svg {
        min-width: 820px;
      }
    }

    .svg-hint {
      margin-top: .5rem;
      font-size: .75rem;
      line-height: 1rem;
      color: var(--slate-500);
    }

    @media (min-width: 640px) {
      .svg-hint {
        display: none;
      }
    }

    /* SVG 内に埋め込むラベル */
    .svg-label {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
    }

    .svg-label > span {
      padding: .25rem .75rem;
      border: 1px solid rgba(255, 255, 255, .2);
      border-radius: 9999px;
      background: rgba(15, 23, 42, .9);
      font-size: .75rem;
      font-weight: 600;
      color: var(--slate-100);
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, .3);
    }

    /* SVG 内に埋め込む入力欄 */
    .svg-input-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .svg-input-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: .25rem .5rem;
      border: 1px solid rgba(255, 255, 255, .15);
      border-radius: var(--radius-xl);
      background: rgba(15, 23, 42, .95);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, .4);
      pointer-events: auto;
    }

    .svg-input-box input {
      width: 72px;
      padding: .25rem .5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: var(--slate-950);
      color: var(--slate-100);
      font-family: var(--mono);
      font-size: .875rem;
      text-align: center;
      outline: none;
      transition: border-color .15s ease;
    }

    .svg-input-box input:focus {
      border-color: var(--cyan-400);
    }

    .svg-input-box input.is-wide {
      width: 82px;
    }

    .svg-input-box span {
      margin-top: .25rem;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .025em;
      color: var(--slate-400);
    }

    /* =========================================================
       入力パネル
       ========================================================= */
    .input-stack {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .panel {
      padding: .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-2xl);
      background: rgba(2, 6, 23, .6);
    }

    .panel > label {
      display: block;
      margin-bottom: .5rem;
      font-size: .875rem;
      line-height: 1.25rem;
      font-weight: 500;
      color: var(--slate-300);
    }

    .text-input {
      width: 100%;
      min-width: 0;
      padding: .5rem .75rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      background: var(--slate-950);
      color: var(--slate-100);
      font: inherit;
      font-size: .875rem;
      line-height: 1.25rem;
      outline: none;
      transition: border-color .15s ease;
    }

    .text-input:focus {
      border-color: var(--cyan-400);
    }

    /* よく使う吸収端のショートカット */
    .edge-chips {
      display: flex;
      flex-wrap: wrap;
      gap: .5rem;
      margin-top: .75rem;
    }

    .edge-chip {
      padding: .25rem .75rem;
      border: 1px solid var(--line);
      border-radius: 9999px;
      background: rgba(255, 255, 255, .05);
      color: var(--slate-300);
      font: inherit;
      font-size: .75rem;
      line-height: 1rem;
      cursor: pointer;
      transition: border-color .15s ease, color .15s ease, background-color .15s ease;
    }

    .edge-chip:hover {
      border-color: rgba(103, 232, 249, .5);
      color: #fff;
    }

    .edge-chip.is-active {
      border-color: var(--cyan-300);
      background: rgba(103, 232, 249, .2);
      color: var(--cyan-100);
    }

    /* パラメータ一覧表 */
    .summary {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: var(--radius-2xl);
      background: rgba(15, 23, 42, .7);
    }

    .summary-row {
      display: grid;
      gap: .5rem;
      padding: .625rem .75rem;
      border-top: 1px solid var(--line-soft);
    }

    .summary-row:first-child {
      border-top: 0;
    }

    @media (min-width: 640px) {
      .summary-row {
        grid-template-columns: minmax(0, 0.95fr) minmax(0, 1.05fr);
        align-items: center;
      }
    }

    .summary-row > label {
      cursor: help;
      font-size: .875rem;
      line-height: 1.25rem;
      font-weight: 500;
      color: var(--slate-300);
    }

    .summary-field {
      display: flex;
      align-items: center;
      gap: .5rem;
    }

    .summary-field input {
      width: 100%;
      min-width: 0;
      padding: .375rem .5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(2, 6, 23, .8);
      color: var(--slate-100);
      font-family: var(--mono);
      font-size: .875rem;
      outline: none;
      transition: border-color .15s ease;
    }

    .summary-field input:focus {
      border-color: var(--cyan-400);
    }

    .summary-unit {
      flex-shrink: 0;
      font-size: .75rem;
      color: var(--slate-400);
    }

    @media (min-width: 640px) {
      .summary-unit {
        font-size: .875rem;
      }
    }

    /* 予測測定時間 */
    .estimate {
      padding: 1rem;
      border: 1px solid rgba(34, 211, 238, .2);
      border-radius: var(--radius-2xl);
      background: rgba(34, 211, 238, .1);
    }

    .estimate-label {
      font-size: .75rem;
      line-height: 1rem;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: rgba(165, 243, 252, .7);
    }

    .estimate-value {
      margin-top: .5rem;
      font-size: 1.5rem;
      line-height: 2rem;
      font-weight: 600;
      color: var(--cyan-50);
    }

    .estimate-formula {
      margin-top: .5rem;
      font-size: .75rem;
      line-height: 1rem;
      color: rgba(207, 250, 254, .7);
    }

    /* =========================================================
       詳細調整表
       ========================================================= */
    .detail-section {
      margin-top: .75rem;
    }

    .detail-head {
      display: flex;
      flex-direction: column;
      gap: .75rem;
      margin-bottom: 1rem;
    }

    @media (min-width: 640px) {
      .detail-head {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .detail-actions {
      display: flex;
      flex-wrap: wrap;
      align-items: stretch;
      gap: .75rem;
      width: 100%;
    }

    @media (min-width: 640px) {
      .detail-actions {
        width: auto;
        align-items: center;
      }
    }

    .total-box {
      width: 100%;
      padding: .5rem 1rem;
      border: 1px solid rgba(52, 211, 153, .2);
      border-radius: var(--radius-xl);
      background: rgba(52, 211, 153, .1);
    }

    @media (min-width: 640px) {
      .total-box {
        width: auto;
      }
    }

    .total-label {
      font-size: 10px;
      line-height: 1rem;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: rgba(167, 243, 208, .7);
    }

    .total-value {
      font-weight: 600;
      color: var(--emerald-50);
    }

    .total-note {
      font-size: 10px;
      line-height: 1rem;
      color: rgba(209, 250, 229, .7);
    }

    .button {
      width: 100%;
      padding: .625rem 1rem;
      border: 0;
      border-radius: var(--radius-xl);
      font: inherit;
      font-size: .875rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }

    @media (min-width: 640px) {
      .button {
        width: auto;
      }
    }

    .button--primary {
      background: var(--cyan-400);
      color: var(--slate-950);
    }

    .button--primary:hover {
      background: var(--cyan-300);
    }

    .button--ghost {
      border: 1px solid rgba(255, 255, 255, .15);
      background: rgba(255, 255, 255, .05);
      color: var(--slate-100);
      font-weight: 500;
    }

    .button--ghost:hover {
      border-color: rgba(103, 232, 249, .5);
      background: rgba(103, 232, 249, .1);
    }

    .table-scroller {
      max-width: 100%;
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: var(--radius-2xl);
      background: rgba(2, 6, 23, .5);
    }

    .detail-table {
      width: max-content;
      min-width: 100%;
      border-collapse: separate;
      border-spacing: 0;
    }

    .detail-table th {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: .75rem;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, .95);
      backdrop-filter: blur(8px);
      font-size: .75rem;
      font-weight: 600;
      letter-spacing: .24em;
      text-align: left;
      text-transform: uppercase;
      color: var(--slate-400);
    }

    .detail-table td {
      padding: .75rem;
      border-bottom: 1px solid var(--line-soft);
      vertical-align: top;
    }

    .detail-table .region-cell {
      font-size: .875rem;
      font-weight: 500;
      color: var(--slate-300);
    }

    .cell-input {
      width: 100%;
      min-width: 76px;
      padding: .375rem .5rem;
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      background: rgba(2, 6, 23, .8);
      color: var(--slate-100);
      font-family: var(--mono);
      font-size: .75rem;
      outline: none;
      transition: border-color .15s ease;
    }

    .cell-input:focus {
      border-color: var(--cyan-400);
    }

    @media (min-width: 640px) {
      .cell-input {
        min-width: 90px;
        font-size: .875rem;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <header class="card card--header">
      <p class="eyebrow">XAFS Condition Maker</p>
      <div class="header-body">
        <div>
          <h1 class="page-title">XAFS測定条件メーカー</h1>
          <p class="page-subtitle">グラフィカルに測定条件を作れます。</p>
        </div>
        <div class="edge-readout">
          <div>選択中の吸収端: <strong id="selectedEdgeKey"></strong></div>
          <div id="selectedEdgeEnergy" class="edge-readout-energy"></div>
        </div>
      </div>
    </header>

    <main class="layout">
      <!-- グラフィカル入力 -->
      <section class="card">
        <div class="section-title">
          <p class="eyebrow">Visual Editor</p>
          <h2>グラフィカル入力</h2>
          <p>測定範囲の主要パラメータを視覚的に調整します。</p>
        </div>
        <div class="svg-frame">
          <div class="svg-scroller">
            <svg viewBox="0 0 850 560" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6"
                  orient="auto-start-reverse">
                  <path d="M 0 2 L 10 5 L 0 8 z" fill="#cbd5e1" />
                </marker>
              </defs>

              <!-- 領域の帯 -->
              <rect x="120" y="48" width="145" height="395" rx="16" fill="#38bdf8" fill-opacity="0.06" />
              <rect x="265" y="48" width="215" height="395" rx="16" fill="#f43f5e" fill-opacity="0.06" />
              <rect x="480" y="48" width="300" height="395" rx="16" fill="#22c55e" fill-opacity="0.06" />

              <text x="190" y="32" text-anchor="middle" fill="#67e8f9" font-weight="700" font-size="14">Pre-edge</text>
              <text x="372" y="32" text-anchor="middle" fill="#fda4af" font-weight="700" font-size="14">XANES / Edge</text>
              <text x="630" y="32" text-anchor="middle" fill="#86efac" font-weight="700" font-size="14">EXAFS</text>

              <!-- 区切り線 -->
              <line x1="120" y1="48" x2="120" y2="510" stroke="#475569" stroke-width="1" />
              <line x1="265" y1="48" x2="265" y2="450" stroke="#64748b" stroke-dasharray="5 5" stroke-width="1.5" />
              <line x1="360" y1="48" x2="360" y2="510" stroke="#fbbf24" stroke-dasharray="6 4" stroke-width="2" />
              <line x1="480" y1="48" x2="480" y2="450" stroke="#64748b" stroke-dasharray="5 5" stroke-width="1.5" />
              <line x1="780" y1="48" x2="780" y2="450" stroke="#64748b" stroke-width="1.5" />
              <line x1="80" y1="380" x2="810" y2="380" stroke="#1e293b" stroke-width="1" />

              <!-- スペクトルの模式図 -->
              <path d="M 120 374 Q 190 380 265 370" fill="none" stroke="#38bdf8" stroke-width="3"
                stroke-linecap="round" />
              <path d="M 265 370 C 330 360, 338 150, 380 145 C 430 145, 445 250, 480 260" fill="none" stroke="#f43f5e"
                stroke-width="3" stroke-linecap="round" />
              <path
                d="M 480 260
                   L 500 246
                   L 520 274
                   L 540 248
                   L 560 282
                   L 580 252
                   L 600 286
                   L 620 256
                   L 640 290
                   L 660 260
                   L 680 292
                   L 700 264
                   L 720 294
                   L 740 268
                   L 760 296
                   L 780 272"
                fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round" />

              <!-- 軸ラベル -->
              <foreignObject x="34" y="50" width="72" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-label"><span>k</span></div>
              </foreignObject>
              <foreignObject x="34" y="415" width="72" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-label"><span>eV</span></div>
              </foreignObject>
              <foreignObject x="324" y="50" width="72" height="40">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-label"><span>0</span></div>
              </foreignObject>

              <!-- Epre_min -->
              <line x1="126" y1="508" x2="354" y2="508" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow)"
                marker-end="url(#arrow)" />
              <foreignObject x="188" y="471" width="104" height="68" overflow="visible">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-input-wrap">
                  <div class="svg-input-box">
                    <input type="text" data-param="epreMin" aria-label="Epre_min" />
                    <span>Epre_min</span>
                  </div>
                </div>
              </foreignObject>

              <!-- Epre_max -->
              <line x1="271" y1="448" x2="354" y2="448" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow)"
                marker-end="url(#arrow)" />
              <foreignObject x="260" y="412" width="104" height="68" overflow="visible">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-input-wrap">
                  <div class="svg-input-box">
                    <input type="text" data-param="epreMax" aria-label="Epre_max" />
                    <span>Epre_max</span>
                  </div>
                </div>
              </foreignObject>

              <!-- E0 -->
              <foreignObject x="308" y="251" width="104" height="68" overflow="visible">
                <div xmlns="http://www.w3.org/1999/xhtml" class="svg-input-wrap">
                  <div class="svg-input-box">
                    <input type="text" class="is-wide" data-param="e0" aria-label="E0 (eV)" />
                    <span>E0 (eV)</span>
                  </div>
                </div>
              </foreignObject>

              <!-- XANES_k_end -->
              <line x1="366" y1="108" x2="474" y2="108" stroke="#cbd5e1" stroke-width="1.5" marker-start="url(#arrow)"
                marker-end="url(#arrow)" />
              <foreignObject x="428" y="48" width="104" height="68" overflow="visible">

    /**
     * 吸収端辞書を UI 用の配列へ整形する。
     * 検索しやすい文字列も併せて持たせる。
     */
    const EDGE_OPTIONS = Object.entries(EDGE_ENERGY_MAP)
      .map(([key, energy]) => {
        const [element, edge] = key.split("-");
        return {
          key,
          element,
          edge,
          energy,
          label: `${element}-${edge}`,
          description: `${element} ${edge} (${energy} eV)`,
          searchText: `${key} ${element} ${edge} ${energy}`.toLowerCase(),
        };
      })
      .sort((left, right) => left.energy - right.energy);

    /** 参照しやすいようにキー辞書も作る */
    const EDGE_LOOKUP = EDGE_OPTIONS.reduce((accumulator, option) => {
      accumulator[option.key] = option;
      return accumulator;
    }, {});

    /**
     * 数値入力用のデフォルト状態を返す。
     * 文字列保持にすることで入力中の値を崩さない。
     */
    function createDefaultParams() {
      return {
        e0: "8978.9",
        epreMin: "100",
        epreMax: "20",
        xanesKEnd: "3",
        kmax: "12",
        numstep: "20",
        numstepXanes: "150",
        exposureTime: "1",
      };
    }

    /** 数値のパース補助 */
    function parseMaybeNumber(value) {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : null;
    }

    /** 整数想定の値を正の数として扱う */
    function parsePositiveNumber(value, fallback = 0) {
      const parsed = parseMaybeNumber(value);
      return parsed !== null && parsed > 0 ? parsed : fallback;
    }

    /** CSV・表示用に小数を丸めて文字列化する */
    function formatDecimal(value, digits = 4) {
      if (!Number.isFinite(value)) {
        return "";
      }
      return String(Number(value.toFixed(digits)));
    }

    /** 時間表示を分かりやすい文字列に整える */
    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "―";
      }
      if (seconds < 60) {
        return `${formatDecimal(seconds, 1)} s`;
      }
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      if (minutes < 60) {
        return `${minutes} min ${formatDecimal(remain, 1)} s`;
      }
      const hours = Math.floor(minutes / 60);
      const remainMinutes = minutes % 60;
      return `${hours} h ${remainMinutes} min`;
    }

    /** k 値を E0 からのエネルギー差に変換する */
    function convertKToEnergyOffset(kValue) {
      return K_ENERGY_FACTOR * kValue * kValue;
    }

    /** k 値を絶対エネルギーへ変換する */
    function convertKToAbsoluteEnergy(e0, kValue) {
      return e0 + convertKToEnergyOffset(kValue);
    }

    /**
     * 入力パラメータから測定条件表を生成する。
     * Pre-edge、XANES、EXAFS の順に行を並べる。
     */
    function generateMeasurementRows(params) {
      const e0 = parseMaybeNumber(params.e0) ?? 0;
      const epreMin = Math.max(0, parseMaybeNumber(params.epreMin) ?? 0);
      const epreMax = Math.max(0, parseMaybeNumber(params.epreMax) ?? 0);
      const xanesKEnd = Math.max(0, parseMaybeNumber(params.xanesKEnd) ?? 0);
      const kmax = Math.max(xanesKEnd, parseMaybeNumber(params.kmax) ?? xanesKEnd);
      const numstep = parsePositiveNumber(params.numstep, 1);
      const numstepXanes = parsePositiveNumber(params.numstepXanes, 1);
      const exposureTime = parsePositiveNumber(params.exposureTime, 1);

      const rows = [];
      const preInit = e0 - epreMin;
      const preFinal = e0 - epreMax;
      const xanesFinal = convertKToAbsoluteEnergy(e0, xanesKEnd);

      rows.push({
        id: "pre-edge",
        region: "Pre-edge",
        initEnergy: formatDecimal(preInit),
        finalEnergy: formatDecimal(preFinal),
        numberOfSteps: formatDecimal(numstep),
        exposureTime: formatDecimal(exposureTime),
        stepEnergy: formatDecimal((preFinal - preInit) / numstep),
        initK: "None",
        finalK: "None",
      });

      rows.push({
        id: "xanes",
        region: "XANES",
        initEnergy: formatDecimal(preFinal),
        finalEnergy: formatDecimal(xanesFinal),
        numberOfSteps: formatDecimal(numstepXanes),
        exposureTime: formatDecimal(exposureTime),
        stepEnergy: formatDecimal((xanesFinal - preFinal) / numstepXanes),
        initK: "None",
        finalK: formatDecimal(xanesKEnd),
      });

      let currentInitEnergy = xanesFinal;
      let currentInitK = xanesKEnd;
      let rowIndex = 0;

      while (currentInitK < kmax) {
        const currentFinalK = Math.min(currentInitK + 1, kmax);
        const currentFinalEnergy = convertKToAbsoluteEnergy(e0, currentFinalK);
        rows.push({
          id: `exafs-${rowIndex}`,
          region: "EXAFS",
          initEnergy: formatDecimal(currentInitEnergy),
          finalEnergy: formatDecimal(currentFinalEnergy),
          numberOfSteps: formatDecimal(numstep),
          exposureTime: formatDecimal(exposureTime),
          stepEnergy: formatDecimal((currentFinalEnergy - currentInitEnergy) / numstep),
          initK: formatDecimal(currentInitK),
          finalK: formatDecimal(currentFinalK),
        });
        currentInitEnergy = currentFinalEnergy;
        currentInitK = currentFinalK;
        rowIndex += 1;
      }

      return rows;
    }

    /** 保存済みデータを読み込んで初期状態を組み立てる */
    function createInitialState() {
      const defaultParams = createDefaultParams();

      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          const params = { ...defaultParams, ...(parsed.params || {}) };
          const selectedEdgeKey = EDGE_LOOKUP[parsed.selectedEdgeKey] ? parsed.selectedEdgeKey : DEFAULT_EDGE_KEY;
          const rows = Array.isArray(parsed.rows) && parsed.rows.length > 0
            ? parsed.rows
            : generateMeasurementRows(params);

          return {
            selectedEdgeKey,
            edgeSearch: parsed.edgeSearch || selectedEdgeKey,
            params,
            rows,
            lastGeneratedAt: parsed.lastGeneratedAt || null,
          };
        }
      } catch (error) {
        console.error("XAFS状態の復元に失敗しました", error);
      }

      return {
        selectedEdgeKey: DEFAULT_EDGE_KEY,
        edgeSearch: DEFAULT_EDGE_KEY,
        params: defaultParams,
        rows: generateMeasurementRows(defaultParams),
        lastGeneratedAt: null,
      };
    }

    /** 画面全体の状態 */
    const state = createInitialState();

    /** 参照する DOM 要素 */
    const el = {};
    for (const id of [
      "selectedEdgeKey", "selectedEdgeEnergy", "edgeSearch", "edge-list", "edgeChips",
      "summary", "estimateValue", "estimateFormula",
      "totalValue", "totalNote", "regenerate", "exportCsv", "detailHead", "detailBody",
    ]) {
      el[id] = document.getElementById(id);
    }

    /** パラメータ名 → 入力欄（SVG 側と一覧表側の2か所にある） */
    const paramInputs = {};

    /** 現在の状態を localStorage へ保存する */
    function saveState() {
      try {
        window.localStorage.setItem(STORAGE_KEY, JSON.stringify({
          selectedEdgeKey: state.selectedEdgeKey,
          edgeSearch: state.edgeSearch,
          params: state.params,
          rows: state.rows,
          lastGeneratedAt: state.lastGeneratedAt,
        }));
      } catch (error) {
        console.error("XAFS状態の保存に失敗しました", error);
      }
    }

    /** CSV ダウンロードを行う */
    function downloadCsv(rows) {
      const csvLines = [
        CSV_HEADERS.join(","),
        ...rows.map((row) => ROW_FIELDS
          .map((field) => `"${String(row[field] ?? "").replaceAll('"', '""')}"`)
          .join(",")),
      ];

      const now = new Date();
      const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0"),
      ].join("");

      const blob = new Blob([`\uFEFF${csvLines.join("\n")}`], {
        type: "text/csv;charset=utf-8;",
      });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `XAFS_measurement_condition_${timestamp}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    /* =========================================================
       画面の組み立て（初回のみ）
       ========================================================= */

    /** 吸収端のオートコンプリート候補を作る */
    function buildEdgeDatalist() {
      const fragment = document.createDocumentFragment();
      for (const option of EDGE_OPTIONS) {
        const node = document.createElement("option");
        node.value = option.key;
        node.textContent = option.description;
        fragment.appendChild(node);
      }
      el["edge-list"].appendChild(fragment);
    }

    /** よく使う吸収端のボタンを作る */
    function buildEdgeChips() {
      const fragment = document.createDocumentFragment();
      for (const key of FEATURED_EDGES) {
        if (!EDGE_LOOKUP[key]) continue;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "edge-chip";
        button.dataset.edge = key;
        button.textContent = key;
        button.addEventListener("click", () => selectEdge(key));
        fragment.appendChild(button);
      }
      el.edgeChips.appendChild(fragment);
    }

    /** パラメータ一覧表を作る */
    function buildSummaryTable() {
      const fragment = document.createDocumentFragment();
      for (const { label, key, unit, description } of SUMMARY_FIELDS) {
        const row = document.createElement("div");
        row.className = "summary-row";

        const labelNode = document.createElement("label");
        labelNode.htmlFor = `summary-${key}`;
        labelNode.title = description;
        labelNode.textContent = label;

        const field = document.createElement("div");
        field.className = "summary-field";

        const input = document.createElement("input");
        input.type = "text";
        input.id = `summary-${key}`;
        input.dataset.param = key;
        field.appendChild(input);

        if (unit) {
          const unitNode = document.createElement("span");
          unitNode.className = "summary-unit";
          unitNode.textContent = unit;
          field.appendChild(unitNode);
        }

        row.append(labelNode, field);
        fragment.appendChild(row);
      }
      el.summary.appendChild(fragment);
    }

    /** 詳細調整表のヘッダーを作る */
    function buildDetailHead() {
      const fragment = document.createDocumentFragment();
      for (const header of ["Region", ...CSV_HEADERS]) {
        const th = document.createElement("th");
        th.scope = "col";
        th.textContent = header;
        fragment.appendChild(th);
      }
      el.detailHead.appendChild(fragment);
    }

    /* =========================================================
       描画
       ========================================================= */

    /** 選択中の吸収端まわりの表示を更新する */
    function renderEdge() {
      const selectedEdge = EDGE_LOOKUP[state.selectedEdgeKey] || EDGE_LOOKUP[DEFAULT_EDGE_KEY];
      el.selectedEdgeKey.textContent = selectedEdge.key;
      el.selectedEdgeEnergy.textContent = `${formatDecimal(selectedEdge.energy, 1)} eV`;
      for (const chip of el.edgeChips.children) {
        chip.classList.toggle("is-active", chip.dataset.edge === state.selectedEdgeKey);
      }
    }

    /** パラメータから予測測定時間を更新する */
    function renderEstimate() {
      const params = state.params;
      const xanesKEnd = Math.max(0, parseMaybeNumber(params.xanesKEnd) ?? 0);
      const kmax = Math.max(xanesKEnd, parseMaybeNumber(params.kmax) ?? xanesKEnd);
      const numstep = parsePositiveNumber(params.numstep, 0);
      const numstepXanes = parsePositiveNumber(params.numstepXanes, 0);
      const exposureTime = parsePositiveNumber(params.exposureTime, 0);

      const estimatedTime = (numstep + numstepXanes + numstep * Math.max(0, kmax - xanesKEnd))
        * (exposureTime + 1.3);

      el.estimateValue.textContent = formatDuration(estimatedTime);
      el.estimateFormula.textContent =
        `(${numstep} + ${numstepXanes} + ${numstep} × (${formatDecimal(kmax, 2)} - ${formatDecimal(xanesKEnd, 2)}))`
        + ` × (${formatDecimal(exposureTime, 2)} + 1.3)`;
    }

    /** 行データから合計時間を更新する */
    function renderTotals() {
      const detailedTotalTime = state.rows.reduce((accumulator, row) => {
        const rowSteps = parsePositiveNumber(row.numberOfSteps, 0);
        const rowExposure = parsePositiveNumber(row.exposureTime, 0);
        return accumulator + rowSteps * (rowExposure + 1.3);
      }, 0);
      const exafsRowCount = state.rows.filter((row) => row.region === "EXAFS").length;

      el.totalValue.textContent = formatDuration(detailedTotalTime);
      el.totalNote.textContent = `${state.rows.length} 行 / EXAFS ${exafsRowCount} 行`;
    }

    /** 詳細調整表の中身を組み直す */
    function renderDetailTable() {
      const fragment = document.createDocumentFragment();
      for (const row of state.rows) {
        const tr = document.createElement("tr");

        const regionCell = document.createElement("td");
        regionCell.className = "region-cell";
        regionCell.textContent = row.region ?? "";
        tr.appendChild(regionCell);

        for (const field of ROW_FIELDS) {
          const td = document.createElement("td");
          const input = document.createElement("input");
          input.type = "text";
          input.className = "cell-input";
          input.value = row[field] ?? "";
          input.dataset.rowId = row.id;
          input.dataset.field = field;
          input.setAttribute("aria-label", `${row.region} ${field}`);
          td.appendChild(input);
          tr.appendChild(td);
        }

        fragment.appendChild(tr);
      }

      el.detailBody.replaceChildren(fragment);
      renderTotals();
    }

    /* =========================================================
       操作
       ========================================================= */

    /**
     * パラメータの値を反映する。
     * 入力中の欄の値は書き換えず、もう一方の欄だけ同期させる。
     */
    function setParam(key, value, sourceInput) {
      state.params[key] = value;
      for (const input of paramInputs[key] || []) {
        if (input !== sourceInput && input.value !== value) {
          input.value = value;
        }
      }
      renderEstimate();
      saveState();
    }

    /** 吸収端を選び、E0 に反映する */
    function selectEdge(edgeKey) {
      const selected = EDGE_LOOKUP[edgeKey];
      if (!selected) {
        return;
      }
      state.selectedEdgeKey = edgeKey;
      state.edgeSearch = edgeKey;
      el.edgeSearch.value = edgeKey;
      setParam("e0", formatDecimal(selected.energy, 1));
      renderEdge();
      saveState();
    }

    /** 候補が入力と一致したときは即選択する */
    function handleEdgeSearchChange(value) {
      state.edgeSearch = value;
      const normalized = value.trim().toLowerCase();
      const exactMatch = EDGE_OPTIONS.find((option) => (
        option.key.toLowerCase() === normalized
        || option.description.toLowerCase() === normalized
        || option.label.toLowerCase() === normalized
      ));
      if (exactMatch) {
        selectEdge(exactMatch.key);
      } else {
        saveState();
      }
    }

    /** 現在のパラメータから測定条件表を作り直す */
    function regenerateRows() {
      state.rows = generateMeasurementRows(state.params);
      state.lastGeneratedAt = new Date().toISOString();
      renderDetailTable();
      saveState();
    }

    /** 詳細調整表のセル編集を行データへ書き戻す */
    function handleCellInput(event) {
      const input = event.target;
      if (!input.dataset || !input.dataset.rowId) {
        return;
      }
      const row = state.rows.find((item) => item.id === input.dataset.rowId);
      if (!row) {
        return;
      }
      row[input.dataset.field] = input.value;
      renderTotals();
      saveState();
    }

    /** 初期化：DOM を組み立て、状態を反映し、イベントを結線する */
    function init() {
      buildEdgeDatalist();
      buildEdgeChips();
      buildSummaryTable();
      buildDetailHead();

      // SVG 側と一覧表側、同じパラメータの入力欄をまとめて扱えるようにする
      for (const input of document.querySelectorAll("[data-param]")) {
        const key = input.dataset.param;
        (paramInputs[key] ||= []).push(input);
        input.value = state.params[key] ?? "";
        input.addEventListener("input", (event) => setParam(key, event.target.value, event.target));
      }

      el.edgeSearch.value = state.edgeSearch;
      el.edgeSearch.addEventListener("input", (event) => handleEdgeSearchChange(event.target.value));

      el.regenerate.addEventListener("click", regenerateRows);
      el.exportCsv.addEventListener("click", () => downloadCsv(state.rows));
      el.detailBody.addEventListener("input", handleCellInput);

      renderEdge();
      renderEstimate();
      renderDetailTable();
    }

    document.addEventListener("DOMContentLoaded", init);
  </script>
</body>

</html>
