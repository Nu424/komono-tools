    /**
     * 数値入力用のデフォルト状態を返す。
     * 文字列保持にすることで入力中の値を崩さない。
     */
    function createDefaultParams() {
      return {
        e0: "8978.9",
        epreMin: "100",
        epreMax: "20",
        xanesKEnd: "3",
        kmax: "12",
        numstep: "20",
        numstepXanes: "150",
        exposureTime: "1",
      };
    }

    /**
     * 吸収端辞書を UI 用の配列へ整形する。
     * 検索しやすい文字列も併せて持たせる。
     */
    const EDGE_OPTIONS = Object.entries(EDGE_ENERGY_MAP)
      .map(([key, energy]) => {
        const [element, edge] = key.split("-");
        return {
          key,
          element,
          edge,
          energy,
          label: `${element}-${edge}`,
          description: `${element} ${edge} (${energy} eV)`,
          searchText: `${key} ${element} ${edge} ${energy}`.toLowerCase(),
        };
      })
      .sort((left, right) => left.energy - right.energy);

    /** 参照しやすいようにキー辞書も作る */
    const EDGE_LOOKUP = EDGE_OPTIONS.reduce((accumulator, option) => {
      accumulator[option.key] = option;
      return accumulator;
    }, {});

    /** よく使いそうな吸収端を先頭で選びやすくする */
    const FEATURED_EDGES = ["Cu-K", "Fe-K", "Ni-K", "Co-K", "Pt-L3", "Au-L3"];

    /** 数値のパース補助 */
    function parseMaybeNumber(value) {
      const parsed = Number.parseFloat(value);
      return Number.isFinite(parsed) ? parsed : null;
    }

    /** 整数想定の値を正の数として扱う */
    function parsePositiveNumber(value, fallback = 0) {
      const parsed = parseMaybeNumber(value);
      return parsed !== null && parsed > 0 ? parsed : fallback;
    }

    /** CSV・表示用に小数を丸めて文字列化する */
    function formatDecimal(value, digits = 4) {
      if (!Number.isFinite(value)) {
        return "";
      }
      return String(Number(value.toFixed(digits)));
    }

    /** 時間表示を分かりやすい文字列に整える */
    function formatDuration(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) {
        return "―";
      }
      if (seconds < 60) {
        return `${formatDecimal(seconds, 1)} s`;
      }
      const minutes = Math.floor(seconds / 60);
      const remain = seconds % 60;
      if (minutes < 60) {
        return `${minutes} min ${formatDecimal(remain, 1)} s`;
      }
      const hours = Math.floor(minutes / 60);
      const remainMinutes = minutes % 60;
      return `${hours} h ${remainMinutes} min`;
    }

    /** k 値を E0 からのエネルギー差に変換する */
    function convertKToEnergyOffset(kValue) {
      return K_ENERGY_FACTOR * kValue * kValue;
    }

    /** k 値を絶対エネルギーへ変換する */
    function convertKToAbsoluteEnergy(e0, kValue) {
      return e0 + convertKToEnergyOffset(kValue);
    }

    /**
     * 入力パラメータから測定条件表を生成する。
     * Prompt の仕様に合わせて、Pre-edge、XANES、EXAFS を並べる。
     */
    function generateMeasurementRows(params) {
      const e0 = parseMaybeNumber(params.e0) ?? 0;
      const epreMin = Math.max(0, parseMaybeNumber(params.epreMin) ?? 0);
      const epreMax = Math.max(0, parseMaybeNumber(params.epreMax) ?? 0);
      const xanesKEnd = Math.max(0, parseMaybeNumber(params.xanesKEnd) ?? 0);
      const kmax = Math.max(xanesKEnd, parseMaybeNumber(params.kmax) ?? xanesKEnd);
      const numstep = parsePositiveNumber(params.numstep, 1);
      const numstepXanes = parsePositiveNumber(params.numstepXanes, 1);
      const exposureTime = parsePositiveNumber(params.exposureTime, 1);

      const rows = [];
      const preInit = e0 - epreMin;
      const preFinal = e0 - epreMax;
      const xanesFinal = convertKToAbsoluteEnergy(e0, xanesKEnd);

      rows.push({
        id: "pre-edge",
        region: "Pre-edge",
        initEnergy: formatDecimal(preInit),
        finalEnergy: formatDecimal(preFinal),
        numberOfSteps: formatDecimal(numstep),
        exposureTime: formatDecimal(exposureTime),
        stepEnergy: formatDecimal((preFinal - preInit) / numstep),
        initK: "None",
        finalK: "None",
      });

      rows.push({
        id: "xanes",
        region: "XANES",
        initEnergy: formatDecimal(preFinal),
        finalEnergy: formatDecimal(xanesFinal),
        numberOfSteps: formatDecimal(numstepXanes),
        exposureTime: formatDecimal(exposureTime),
        stepEnergy: formatDecimal((xanesFinal - preFinal) / numstepXanes),
        initK: "None",
        finalK: formatDecimal(xanesKEnd),
      });

      let currentInitEnergy = xanesFinal;
      let currentInitK = xanesKEnd;
      let rowIndex = 0;

      while (currentInitK < kmax) {
        const currentFinalK = Math.min(currentInitK + 1, kmax);
        const currentFinalEnergy = convertKToAbsoluteEnergy(e0, currentFinalK);
        rows.push({
          id: `exafs-${rowIndex}`,
          region: "EXAFS",
          initEnergy: formatDecimal(currentInitEnergy),
          finalEnergy: formatDecimal(currentFinalEnergy),
          numberOfSteps: formatDecimal(numstep),
          exposureTime: formatDecimal(exposureTime),
          stepEnergy: formatDecimal((currentFinalEnergy - currentInitEnergy) / numstep),
          initK: formatDecimal(currentInitK),
          finalK: formatDecimal(currentFinalK),
        });
        currentInitEnergy = currentFinalEnergy;
        currentInitK = currentFinalK;
        rowIndex += 1;
      }

      return rows;
    }

    /** 保存済みデータを読み込んで初期状態を組み立てる */
    function createInitialState() {
      const defaultParams = createDefaultParams();
      const fallbackRows = generateMeasurementRows(defaultParams);

      try {
        const raw = window.localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            selectedEdgeKey: "Cu-K",
            edgeSearch: "Cu-K",
            params: defaultParams,
            rows: fallbackRows,
            lastGeneratedAt: null,
          };
        }

        const parsed = JSON.parse(raw);
        const params = { ...defaultParams, ...(parsed.params || {}) };
        const selectedEdgeKey = EDGE_LOOKUP[parsed.selectedEdgeKey] ? parsed.selectedEdgeKey : "Cu-K";
        const rows = Array.isArray(parsed.rows) && parsed.rows.length > 0 ? parsed.rows : generateMeasurementRows(params);

        return {
          selectedEdgeKey,
          edgeSearch: parsed.edgeSearch || selectedEdgeKey,
          params,
          rows,
          lastGeneratedAt: parsed.lastGeneratedAt || null,
        };
      } catch (error) {
        console.error("XAFS状態の復元に失敗しました", error);
        return {
          selectedEdgeKey: "Cu-K",
          edgeSearch: "Cu-K",
          params: defaultParams,
          rows: fallbackRows,
          lastGeneratedAt: null,
        };
      }
    }

    /** Zustand の vanilla store 本体 */
    const toolStore = createStore((set, get) => ({
      ...createInitialState(),
      setParam(field, value) {
        set((state) => ({
          params: {
            ...state.params,
            [field]: value,
          },
        }));
      },
      setEdgeSearch(value) {
        set({ edgeSearch: value });
      },
      selectEdge(edgeKey) {
        const selected = EDGE_LOOKUP[edgeKey];
        if (!selected) {
          return;
        }
        set((state) => ({
          selectedEdgeKey: edgeKey,
          edgeSearch: edgeKey,
          params: {
            ...state.params,
            e0: formatDecimal(selected.energy, 1),
          },
        }));
      },
      regenerateRows() {
        const params = get().params;
        set({
          rows: generateMeasurementRows(params),
          lastGeneratedAt: new Date().toISOString(),
        });
      },
      updateRowField(rowId, field, value) {
        set((state) => ({
          rows: state.rows.map((row) => (
            row.id === rowId
              ? { ...row, [field]: value }
              : row
          )),
        }));
      },
    }));

    /**
     * vanilla store を React から購読するためのフック。
     * React と Zustand の参照を揃えて、複数 React 混在によるフックエラーを避ける。
     */
    function useToolStore(selector = (state) => state) {
      return React.useSyncExternalStore(
        toolStore.subscribe,
        () => selector(toolStore.getState()),
        () => selector(toolStore.getState()),
      );
    }

          {description ? (
            <p className="mt-1 text-sm text-slate-400">{description}</p>
          ) : null}
        </div>
      );

              {text}
            </div>
          </div>
        </foreignObject>
      );
    }

    /** SVG 上の双方向矢印 */
    function DoubleArrow({ x1, x2, y }) {
      return (
        <line
          x1={x1 + 6}
          y1={y}
          x2={x2 - 6}
          y2={y}
          stroke="#cbd5e1"
          strokeWidth="1.5"
          markerStart="url(#arrow)"
          markerEnd="url(#arrow)"
        />
      );
    }

    /** SVG 上に埋め込む入力欄 */
    function ParameterInput({ x, y, value, onChange, label, width = 72 }) {
      return (
        <foreignObject x={x - 52} y={y - 34} width="104" height="68" className="overflow-visible">
          <div className="pointer-events-none flex h-full w-full items-center justify-center">
            <div className="pointer-events-auto flex flex-col items-center rounded-xl border border-white/15 bg-slate-900/95 px-2 py-1 shadow-xl shadow-black/40">
              <input
                type="text"
                value={value}
                onChange={(event) => onChange(event.target.value)}
                className="rounded-lg border border-white/10 bg-slate-950 px-2 py-1 text-center font-mono text-sm text-slate-100 outline-none transition focus:border-cyan-400"
                style={{ width: `${width}px` }}
              />
              <span className="mt-1 text-[10px] font-semibold tracking-wide text-slate-400">{label}</span>
            </div>
          </div>
        </foreignObject>
      );
    }

    /** サマリ表の小部品（編集可能） */
    function SummaryTable({ params, setParam }) {
      const rows = [
        { label: "E0", key: "e0", unit: " eV" },
        { label: "Epre_min", key: "epreMin", unit: " eV" },
        { label: "Epre_max", key: "epreMax", unit: " eV" },
        { label: "XANES_k_end", key: "xanesKEnd", unit: " k" },
        { label: "kmax", key: "kmax", unit: " k" },
        { label: "numstep", key: "numstep", unit: "" },
        { label: "numstep_xanes", key: "numstepXanes", unit: "" },
        { label: "exposure", key: "exposureTime", unit: " s" },
      ];

      return (
        <div className="overflow-hidden rounded-2xl border border-white/10 bg-slate-900/70">
          <div className="divide-y divide-white/5">
            {rows.map(({ label, key, unit }) => {
              const inputId = `summary-${key}`;
              return (
                <div
                  key={key}
                  className="grid gap-2 px-3 py-2.5 sm:grid-cols-[minmax(0,0.95fr)_minmax(0,1.05fr)] sm:items-center"
                >
                  <label htmlFor={inputId} className="text-sm font-medium text-slate-300">{label}</label>
                  <div className="flex items-center gap-2">
                    <input
                      id={inputId}
                      type="text"
                      value={params[key]}
                      onChange={(e) => setParam(key, e.target.value)}
                      className="w-full min-w-0 rounded-lg border border-white/10 bg-slate-950/80 px-2 py-1.5 font-mono text-sm text-slate-100 outline-none transition focus:border-cyan-400"
                    />
                    {unit ? <span className="shrink-0 text-xs text-slate-400 sm:text-sm">{unit}</span> : null}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /** 表のセル入力 */
    function EditableCell({ value, onChange, mono = true }) {
      return (
        <input
          type="text"
          value={value}
          onChange={(event) => onChange(event.target.value)}
          className={`w-full min-w-[76px] rounded-lg border border-white/10 bg-slate-950/80 px-2 py-1.5 text-xs text-slate-100 outline-none transition focus:border-cyan-400 sm:min-w-[90px] sm:text-sm ${mono ? "font-mono" : ""}`}
        />
      );
    }

    /** CSV ダウンロードを行う */
    function downloadCsv(rows) {
      const csvLines = [
        CSV_HEADERS.join(","),
        ...rows.map((row) => ([
          row.initEnergy,
          row.finalEnergy,
          row.numberOfSteps,
          row.exposureTime,
          row.stepEnergy,
          row.initK,
          row.finalK,
        ].map((value) => `"${String(value ?? "").replaceAll('"', '""')}"`).join(","))),
      ];

      const now = new Date();
      const timestamp = [
        now.getFullYear(),
        String(now.getMonth() + 1).padStart(2, "0"),
        String(now.getDate()).padStart(2, "0"),
        String(now.getHours()).padStart(2, "0"),
        String(now.getMinutes()).padStart(2, "0"),
        String(now.getSeconds()).padStart(2, "0"),
      ].join("");

      const blob = new Blob([`\uFEFF${csvLines.join("\n")}`], {
        type: "text/csv;charset=utf-8;",
      });
      const url = URL.createObjectURL(blob);
      const anchor = document.createElement("a");
      anchor.href = url;
      anchor.download = `XAFS_measurement_condition_${timestamp}.csv`;
      document.body.appendChild(anchor);
      anchor.click();
      document.body.removeChild(anchor);
      URL.revokeObjectURL(url);
    }

    /** メインアプリ */
    function App() {
      const {
        selectedEdgeKey,
        edgeSearch,
        params,
        rows,
        lastGeneratedAt,
        setParam,
        setEdgeSearch,
        selectEdge,
        regenerateRows,
        updateRowField,
      } = useToolStore();

      /** Zustand 上の値を永続化する */
      useEffect(() => {
        try {
          window.localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify({
              selectedEdgeKey,
              edgeSearch,
              params,
              rows,
              lastGeneratedAt,
            }),
          );
        } catch (error) {
          console.error("XAFS状態の保存に失敗しました", error);
        }
      }, [selectedEdgeKey, edgeSearch, params, rows, lastGeneratedAt]);

      const selectedEdge = EDGE_LOOKUP[selectedEdgeKey] || EDGE_LOOKUP["Cu-K"];
      const featuredOptions = FEATURED_EDGES.map((key) => EDGE_LOOKUP[key]).filter(Boolean);

      const e0Number = parseMaybeNumber(params.e0) ?? 0;
      const xanesKEnd = Math.max(0, parseMaybeNumber(params.xanesKEnd) ?? 0);
      const kmax = Math.max(xanesKEnd, parseMaybeNumber(params.kmax) ?? xanesKEnd);
      const numstep = parsePositiveNumber(params.numstep, 0);
      const numstepXanes = parsePositiveNumber(params.numstepXanes, 0);
      const exposureTime = parsePositiveNumber(params.exposureTime, 0);

      /** Prompt の簡易見積もり式 */
      const estimatedTime = (
        (numstep + numstepXanes + numstep * Math.max(0, kmax - xanesKEnd))
        * (exposureTime + 1.3)
      );

      /** 詳細表から再計算した合計時間 */
      const detailedTotalTime = rows.reduce((accumulator, row) => {
        const rowSteps = parsePositiveNumber(row.numberOfSteps, 0);
        const rowExposure = parsePositiveNumber(row.exposureTime, 0);
        return accumulator + rowSteps * (rowExposure + 1.3);
      }, 0);

      const exafsRowCount = rows.filter((row) => row.region === "EXAFS").length;

      /** 候補が入力と一致したときは即選択する */
      function handleEdgeSearchChange(value) {
        setEdgeSearch(value);
        const normalized = value.trim().toLowerCase();
        const exactMatch = EDGE_OPTIONS.find((option) => (
          option.key.toLowerCase() === normalized
          || option.description.toLowerCase() === normalized
          || option.label.toLowerCase() === normalized
        ));
        if (exactMatch) {
          selectEdge(exactMatch.key);
        }
      }

      return (
        <div className="min-h-screen bg-[radial-gradient(circle_at_top,_rgba(34,211,238,0.18),_transparent_32%),linear-gradient(180deg,_#020617_0%,_#020617_100%)]">
          <div className="mx-auto max-w-7xl px-3 py-3 sm:px-4">
            <header className="mb-3 rounded-3xl border border-white/10 bg-slate-900/80 p-4 shadow-2xl shadow-black/30 backdrop-blur">
              <p className="text-xs uppercase tracking-[0.4em] text-cyan-300/70">XAFS Condition Maker</p>
              <div className="mt-2 flex flex-col gap-2 md:flex-row md:items-end md:justify-between">
                <div>
                  <h1 className="text-2xl font-bold text-white">XAFS測定条件メーカー</h1>
                  <p className="mt-1 text-sm text-slate-400">
                    グラフィカルに測定条件を作れます。
                  </p>
                </div>
                <div className="w-full rounded-2xl border border-cyan-400/20 bg-cyan-400/10 px-4 py-3 text-sm text-cyan-100 md:w-auto">
                  <div>選択中の吸収端: <span className="font-semibold">{selectedEdge.key}</span></div>
                  <div className="font-mono text-base">{formatDecimal(selectedEdge.energy, 1)} eV</div>
                </div>
              </div>
            </header>

            <main className="grid min-w-0 gap-3 lg:grid-cols-[1.45fr_0.50fr]">
              <section className="min-w-0 rounded-3xl border border-white/10 bg-slate-900/75 p-4 shadow-2xl shadow-black/30 backdrop-blur">
                <SectionTitle
                  eyebrow="Visual Editor"
                  title="グラフィカル入力"
                  description="測定範囲の主要パラメータを視覚的に調整します。"
                />
                <div className="min-w-0 rounded-2xl border border-white/10 bg-slate-950/60 p-3">
                  <div className="w-full max-w-full overflow-x-auto">
                    <svg viewBox="0 0 850 560" className="h-auto w-full min-w-[560px] rounded-2xl sm:min-w-[620px] md:min-w-[700px] lg:min-w-[820px]">
                    <defs>
                      <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
                        <path d="M 0 2 L 10 5 L 0 8 z" fill="#cbd5e1" />
                      </marker>
                    </defs>

                    <rect x="120" y="48" width="145" height="395" rx="16" fill="#38bdf8" fillOpacity="0.06" />
                    <rect x="265" y="48" width="215" height="395" rx="16" fill="#f43f5e" fillOpacity="0.06" />
                    <rect x="480" y="48" width="300" height="395" rx="16" fill="#22c55e" fillOpacity="0.06" />

                    <text x="190" y="32" textAnchor="middle" fill="#67e8f9" fontWeight="700" fontSize="14">Pre-edge</text>
                    <text x="372" y="32" textAnchor="middle" fill="#fda4af" fontWeight="700" fontSize="14">XANES / Edge</text>
                    <text x="630" y="32" textAnchor="middle" fill="#86efac" fontWeight="700" fontSize="14">EXAFS</text>

                    <line x1="120" y1="48" x2="120" y2="510" stroke="#475569" strokeWidth="1" />
                    <line x1="265" y1="48" x2="265" y2="450" stroke="#64748b" strokeDasharray="5 5" strokeWidth="1.5" />
                    <line x1="360" y1="48" x2="360" y2="510" stroke="#fbbf24" strokeDasharray="6 4" strokeWidth="2" />
                    <line x1="480" y1="48" x2="480" y2="450" stroke="#64748b" strokeDasharray="5 5" strokeWidth="1.5" />
                    <line x1="780" y1="48" x2="780" y2="450" stroke="#64748b" strokeWidth="1.5" />
                    <line x1="80" y1="380" x2="810" y2="380" stroke="#1e293b" strokeWidth="1" />

                    <path
                      d="M 120 374 Q 190 380 265 370"
                      fill="none"
                      stroke="#38bdf8"
                      strokeWidth="3"
                      strokeLinecap="round"
                    />
                    <path
                      d="M 265 370 C 330 360, 338 150, 380 145 C 430 145, 445 250, 480 260"
                      fill="none"
                      stroke="#f43f5e"
                      strokeWidth="3"
                      strokeLinecap="round"
                    />
                    <path
                      d="M 480 260
                        L 500 246
                        L 520 274
                        L 540 248
                        L 560 282
                        L 580 252
                        L 600 286
                        L 620 256
                        L 640 290
                        L 660 260
                        L 680 292
                        L 700 264
                        L 720 294
                        L 740 268
                        L 760 296
                        L 780 272"
                      fill="none"
                      stroke="#22c55e"
                      strokeWidth="3"
                      strokeLinecap="round"
                    />

                    <LabelBox x={70} y={70} text="k" />
                    <LabelBox x={70} y={435} text="eV" />
                    <LabelBox x={360} y={70} text="0" />

                    <DoubleArrow x1={120} x2={360} y={508} />
                    <ParameterInput
                      x={240}
                      y={505}
                      value={params.epreMin}
                      onChange={(value) => setParam("epreMin", value)}
                      label="Epre_min"
                    />

                    <DoubleArrow x1={265} x2={360} y={448} />
                    <ParameterInput
                      x={312}
                      y={446}
                      value={params.epreMax}
                      onChange={(value) => setParam("epreMax", value)}
                      label="Epre_max"
                    />

                    <ParameterInput
                      x={360}
                      y={285}
                      value={params.e0}
                      onChange={(value) => setParam("e0", value)}
                      label="E0 (eV)"
                      width={82}
                    />

                    <DoubleArrow x1={360} x2={480} y={108} />
                    <ParameterInput
                      x={480}
                      y={82}
                      value={params.xanesKEnd}
                      onChange={(value) => setParam("xanesKEnd", value)}
                      label="XANES_k_end"
                    />

                    <ParameterInput
                      x={780}
                      y={82}
                      value={params.kmax}
                      onChange={(value) => setParam("kmax", value)}
                      label="kmax"
                    />
                    </svg>
                  </div>
                  <p className="mt-2 text-xs text-slate-500 sm:hidden">表示が狭い場合は横スクロールして編集できます。</p>
                </div>
              </section>

              <section className="min-w-0 rounded-3xl border border-white/10 bg-slate-900/75 p-4 shadow-2xl shadow-black/30 backdrop-blur">
                <SectionTitle
                  eyebrow="Inputs"
                  title="吸収端と測定パラメータ"
                  description="吸収端などの測定パラメータを入力します。"
                />

                <div className="space-y-4">
                  <div className="rounded-2xl border border-white/10 bg-slate-950/60 p-3">
                    <label className="mb-2 block text-sm font-medium text-slate-300">吸収端を検索</label>
                    <input
                      list="edge-list"
                      value={edgeSearch}
                      onChange={(event) => handleEdgeSearchChange(event.target.value)}
                      placeholder="例: Cu-K, Fe-K, Pt-L3"
                      className="w-full rounded-xl border border-white/10 bg-slate-950 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-cyan-400"
                    />
                    <datalist id="edge-list">
                      {EDGE_OPTIONS.map((option) => (
                        <option key={option.key} value={option.key}>{option.description}</option>
                      ))}
                    </datalist>

                    <div className="mt-3 flex flex-wrap gap-2">
                      {featuredOptions.map((option) => (
                        <button
                          key={option.key}
                          type="button"
                          onClick={() => selectEdge(option.key)}
                          className={`rounded-full border px-3 py-1 text-xs transition ${
                            option.key === selectedEdgeKey
                              ? "border-cyan-300 bg-cyan-300/20 text-cyan-100"
                              : "border-white/10 bg-white/5 text-slate-300 hover:border-cyan-300/50 hover:text-white"
                          }`}
                        >
                          {option.key}
                        </button>
                      ))}
                    </div>

                  </div>

                  <SummaryTable params={params} setParam={setParam} />

                  <div className="rounded-2xl border border-cyan-400/20 bg-cyan-400/10 p-4">
                    <p className="text-xs uppercase tracking-[0.28em] text-cyan-200/70">予測測定時間</p>
                    <p className="mt-2 text-2xl font-semibold text-cyan-50">{formatDuration(estimatedTime)}</p>
                    <p className="mt-2 text-xs text-cyan-100/70">
                      ({numstep} + {numstepXanes} + {numstep} × ({formatDecimal(kmax, 2)} - {formatDecimal(xanesKEnd, 2)})) × ({formatDecimal(exposureTime, 2)} + 1.3)
                    </p>
                  </div>

                </div>
              </section>
            </main>

            <section className="mt-3 min-w-0 rounded-3xl border border-white/10 bg-slate-900/75 p-4 shadow-2xl shadow-black/30 backdrop-blur">
              <div className="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
                <div>
                  <SectionTitle
                    eyebrow="Detail Table"
                    title="詳細調整表"
                    description="生成後は各セルを直接編集できます。予測測定時間は行データから再計算されます。"
                  />
                </div>
                <div className="flex w-full flex-wrap items-stretch gap-3 sm:w-auto sm:items-center">
                  <div className="w-full rounded-xl border border-emerald-400/20 bg-emerald-400/10 px-4 py-2 sm:w-auto">
                    <p className="text-[10px] uppercase tracking-[0.2em] text-emerald-200/70">合計時間</p>
                    <p className="font-semibold text-emerald-50">{formatDuration(detailedTotalTime)}</p>
                    <p className="text-[10px] text-emerald-100/70">{rows.length} 行 / EXAFS {exafsRowCount} 行</p>
                  </div>
                  <button
                    type="button"
                    onClick={regenerateRows}
                    className="w-full rounded-xl bg-cyan-400 px-4 py-2.5 text-sm font-semibold text-slate-950 transition hover:bg-cyan-300 sm:w-auto"
                  >
                    現在のパラメータから測定条件表を更新する
                  </button>
                  <button
                    type="button"
                    onClick={() => downloadCsv(rows)}
                    className="w-full rounded-xl border border-white/15 bg-white/5 px-4 py-2.5 text-sm font-medium text-slate-100 transition hover:border-cyan-300/50 hover:bg-cyan-300/10 sm:w-auto"
                  >
                    CSVを書き出す
                  </button>
                </div>
              </div>
              <div className="max-w-full overflow-x-auto rounded-2xl border border-white/10 bg-slate-950/50">
                <table className="w-max min-w-full border-separate border-spacing-0">
                  <thead className="sticky top-0 z-10 bg-slate-900/95 backdrop-blur">
                    <tr>
                      <th className="border-b border-white/10 px-3 py-3 text-left text-xs font-semibold uppercase tracking-[0.24em] text-slate-400">Region</th>
                      {CSV_HEADERS.map((header) => (
                        <th key={header} className="border-b border-white/10 px-3 py-3 text-left text-xs font-semibold uppercase tracking-[0.24em] text-slate-400">
                          {header}
                        </th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {rows.map((row) => (
                      <tr key={row.id} className="align-top">
                        <td className="border-b border-white/5 px-3 py-3 text-sm font-medium text-slate-300">{row.region}</td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.initEnergy} onChange={(value) => updateRowField(row.id, "initEnergy", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.finalEnergy} onChange={(value) => updateRowField(row.id, "finalEnergy", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.numberOfSteps} onChange={(value) => updateRowField(row.id, "numberOfSteps", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.exposureTime} onChange={(value) => updateRowField(row.id, "exposureTime", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.stepEnergy} onChange={(value) => updateRowField(row.id, "stepEnergy", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.initK} onChange={(value) => updateRowField(row.id, "initK", value)} />
                        </td>
                        <td className="border-b border-white/5 px-3 py-3">
                          <EditableCell value={row.finalK} onChange={(value) => updateRowField(row.id, "finalK", value)} />
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>
          </div>
        </div>
      );
    }

    createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
